server:
  port: 8080

spring:
  application:
    name: gateway-service
  # Import config from Config Server
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    # Gateway routes - these can also be loaded from Config Server
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: library-service
          uri: lb://LIBRARY-SERVICE
          predicates:
            - Path=/api/libraries/**, /api/books/**

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**

# Eureka client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,clientConfigServer,discoveryComposite,requiredServices,diskSpace,ping,refreshScope
        liveness:
          include: livenessState
    gateway:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

# Tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO

# Local fallback for early startup before Config Server is reachable.
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456789}
  expiration: ${JWT_EXPIRATION:1800000}

gateway:
  readiness:
    required-services:
      - AUTH-SERVICE
      - LIBRARY-SERVICE
      - INVENTORY-SERVICE
