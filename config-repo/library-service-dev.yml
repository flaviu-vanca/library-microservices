# =============================================================
# LIBRARY SERVICE - Development Profile
# =============================================================

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

# More verbose logging in dev
logging:
  level:
    com.tus.microservices.library: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Shorter circuit breaker wait times for faster testing
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        waitDurationInOpenState: 5000
