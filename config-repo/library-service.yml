# =============================================================
# LIBRARY SERVICE - Base Configuration
# =============================================================

server:
  port: 8081

spring:
  application:
    name: library-service
  datasource:
    url: jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Eureka instance ID (enables multiple instances)
eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,clientConfigServer,discoveryComposite,db,diskSpace,ping,refreshScope

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.lang.Exception
    instances:
      inventoryService:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 1
        waitDuration: 250ms
        enableExponentialBackoff: false
        retryExceptions:
          - java.io.IOException
          - java.net.ConnectException
    instances:
      inventoryService:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 1s
        cancelRunningFuture: true
    instances:
      inventoryService:
        baseConfig: default

# Logging
logging:
  level:
    com.tus.microservices.library: DEBUG
    io.github.resilience4j: DEBUG
