# =============================================================
# GATEWAY SERVICE - Base Configuration
# =============================================================

server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Enable service discovery routing
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          # Explicit route definitions
          routes:
            # Auth Service Routes
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            # Library Service Routes
            - id: library-service
              uri: lb://LIBRARY-SERVICE
              predicates:
                - Path=/api/libraries/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: libraryCircuitBreaker
                    fallbackUri: forward:/fallback/library

            - id: library-books-service
              uri: lb://LIBRARY-SERVICE
              predicates:
                - Path=/api/books/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: libraryCircuitBreaker
                    fallbackUri: forward:/fallback/library

            # Inventory Service Routes
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuitBreaker
                    fallbackUri: forward:/fallback/inventory

          # Default filters applied to all routes
          default-filters:
            # Relay JWT token to downstream services
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# Resilience4j for Gateway Circuit Breakers
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      libraryCircuitBreaker:
        baseConfig: default
      inventoryCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      libraryCircuitBreaker:
        baseConfig: default
      inventoryCircuitBreaker:
        baseConfig: default

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,clientConfigServer,discoveryComposite,requiredServices,diskSpace,ping,refreshScope

gateway:
  readiness:
    required-services:
      - AUTH-SERVICE
      - LIBRARY-SERVICE
      - INVENTORY-SERVICE

# Eureka instance ID
eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty: INFO
