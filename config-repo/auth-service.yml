# =============================================================
# AUTH SERVICE - Base Configuration
# =============================================================

server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3308/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,clientConfigServer,discoveryComposite,db,diskSpace,ping,refreshScope

logging:
  level:
    com.tus.microservices.auth: DEBUG

auth:
  oauth2:
    success-redirect-uri: ${AUTH_OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8085/}
    callback-redirect-uri: ${AUTH_OAUTH2_CALLBACK_REDIRECT_URI:http://localhost:8085/auth/login/oauth2/code/{registrationId}}
    providers:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
      facebook:
        client-id: ${FACEBOOK_CLIENT_ID:}
        client-secret: ${FACEBOOK_CLIENT_SECRET:}
