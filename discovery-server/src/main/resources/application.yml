server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # Standalone mode - don't register self or fetch registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Enable self-preservation to prevent mass deregistration during network issues
    enable-self-preservation: true
    # How often to check for expired instances (ms)
    eviction-interval-timer-in-ms: 5000

# Disable security for development (enable in production)
spring.security.user:
  name: eureka
  password: eureka

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,diskSpace,ping
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
